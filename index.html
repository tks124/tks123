<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 - 太空杀124</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: url('background.jpg') no-repeat center center fixed; /* 保持背景一致 */
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); /* 背景稍微加深一点，方便阅读文字 */
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 800px;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .log-list {
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(5px); /* 毛玻璃效果 */
            border: 1px solid rgba(255,255,255,0.2);
        }
        .log-item {
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .log-item:last-child { border: none; }
        .version {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffeb3b; /* 版本号用亮黄色突出 */
            margin-bottom: 10px;
            display: block;
        }
        .date {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 10px;
            display: block;
        }
        .btn-back {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 25px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            transition: background 0.3s;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="content">
        <h1>📝 更新日志</h1>
        
        <div class="log-list">
            <!-- 示例日志 1 -->
            <div class="log-item">
                <span class="version">v1.2.4 最新版本</span>
                <span class="date">2026-07-21</span>
                <p>1.解决掉了军事版的一个重大bug <br>2. 优化了游戏。<br>3. 新增了反馈渠道。</p>
            </div>

            <!-- 示例日志 2 -->
            <div class="log-item">
                <span class="version">v1.2.0</span>
                <span class="date">2026-06-15</span>
                <p>1. 内容更新。<br>2. 调整了部分单位的平衡性。</p>
            </div>
            
            <!-- 你可以在这里继续添加新的日志 -->
        </div>

        <a href="https://tks124.github.io/124tks/" class="btn-back">返回首页</a>
    </div>
</body>
</html>
